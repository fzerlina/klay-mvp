name: Deploy to GitHub Pages

# Builds the Vite app and publishes dist/ to the `gh-pages` branch on every push
# to main. The repo's Pages source is "Deploy from a branch: gh-pages", so
# pushing the built output to that branch is what makes the live site update.
#
# This replaces the earlier actions/deploy-pages flow, which required the Pages
# source to be set to "GitHub Actions" in repo settings — that was never enabled,
# so every deploy failed while the build succeeded. Publishing to the branch
# needs no repo-settings change and only the default token's contents:write.

on:
  push:
    branches: [main]
  workflow_dispatch:  # allows manual trigger from the Actions tab

# The gh-pages publish pushes a commit to the gh-pages branch, so the workflow
# token needs write access to repo contents.
permissions:
  contents: write

# Cancel in-progress runs when a new commit lands — no point deploying a
# version that's already superseded.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # SPA fallback: GitHub Pages serves 404.html for unknown paths. Copying
      # index.html to 404.html lets client-side routes (e.g. /klay-mvp/customers)
      # survive a hard refresh / deep link instead of returning a 404.
      - name: SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
