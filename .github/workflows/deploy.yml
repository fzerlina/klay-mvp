name: Deploy to GitHub Pages

# Builds the Vite app and publishes dist/ to GitHub Pages on every push to main.
# Replaces the manual `npm run deploy` (gh-pages npm package) flow.
#
# One-time setup: in repo Settings → Pages, set Source to "GitHub Actions"
# (instead of "Deploy from branch: gh-pages"). The legacy gh-pages branch can
# stay for history but is no longer the source of truth.

on:
  push:
    branches: [main]
  workflow_dispatch:  # allows manual trigger from the Actions tab

# Grant the workflow permission to publish the Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Cancel in-progress runs when a new commit lands — no point deploying a
# version that's already superseded.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
